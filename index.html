<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lamsa Design - لمسة تصنع الذكرى</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FEF9EC;--green:#1E3A2F;--gold:#C5A46A;--gold2:#D4AF37;--border:#E9DFC8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Cairo',sans-serif;color:var(--green);overflow-x:hidden}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes bloom{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.hero{text-align:center;padding:18px 16px 20px}
.hero h1{font-family:'Amiri';font-size:32px;line-height:1.2}
.hero h1 span{color:var(--gold);font-style:italic}
.hero p{color:#888;font-size:12px;margin-top:8px;line-height:1.8;max-width:560px;margin-inline:auto}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px;background:rgba(254,249,236,.9);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.fbtn{padding:8px 16px;border-radius:100px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer}
.fbtn.active{background:var(--green);color:#fff;border-color:var(--green)}
.grid-wrap{max-width:1240px;margin:0 auto;padding:16px 14px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#fff;border:1.5px solid var(--border);border-radius:18px;overflow:hidden;transition:.25s;animation:fadeUp .4s both}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.12)}
.card-img{height:360px;position:relative;overflow:hidden;background:#F5EFE0;cursor:pointer;display:grid;place-items:center}
.card-img .type-badge{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92);border:1px solid var(--border);padding:4px 10px;border-radius:100px;font-size:10px;font-weight:800;z-index:2}
.card-body{padding:12px;text-align:center}
.card-title{font-family:'Amiri';font-size:16px;font-weight:700}
.card-desc{font-size:11px;color:#888;margin-top:4px;line-height:1.5}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.btn{border:0;border-radius:10px;padding:10px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Cairo';display:flex;justify-content:center;gap:6px}
.btn-gold{background:linear-gradient(135deg,#D4B67A,var(--gold));color:var(--green)}
.btn-dark{background:var(--green);color:#fff}
.btn-white{background:#fff;border:1.5px solid var(--green);color:var(--green)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 18px;border-radius:100px;font-size:12px;opacity:0;transition:.3s;z-index:9999;pointer-events:none}
.toast.show{opacity:1}
.admin-fab{position:fixed;bottom:16px;left:16px;z-index:90;background:var(--green);color:#fff;border:1px solid var(--gold);padding:11px 18px;border-radius:100px;font-size:13px;font-weight:800;cursor:pointer}

/* MODAL - THIS IS THE FULL INVITATION VIEW */
.inv-modal{position:fixed;inset:0;z-index:500;background:#F9F6EE;display:none;overflow:auto}
.inv-modal.show{display:block}
.inv-modal .close-inv{position:fixed;top:12px;left:12px;width:38px;height:38px;background:#fff;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;z-index:10;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.invite-wrapper{max-width:440px;margin:0 auto;min-height:100vh;background:#F9F6EE;position:relative}
.map-page{height:100vh;min-height:720px;position:relative;background:#F9F6EE;display:flex;flex-direction:column;align-items:center}
.map-inner{width:100%;height:100%;position:relative;max-width:420px;margin:0 auto}
.pin{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.pin-top{top:42px;animation:floatY 3s infinite}
.pin-bottom{bottom:98px;animation:floatY 3s .6s infinite}
.pin-icon{width:34px;height:46px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.pin-name{font-family:'Amiri';font-size:18px;font-weight:700;margin-top:6px;color:#222}
.dotted{position:absolute;left:50%;top:96px;bottom:160px;width:2px;transform:translateX(-50%)}
.steps{position:absolute;left:50%;top:120px;bottom:200px;transform:translateX(-50%);width:280px;display:flex;flex-direction:column;justify-content:space-between;z-index:2}
.step{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.step span.label{background:#fff;border:1px solid #E8E0D0;border-radius:10px;padding:5px 12px;font-size:13px;min-width:90px;text-align:center;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.step span.dot{width:8px;height:8px;background:#333;border-radius:50%}
.heart{position:absolute;left:50%;top:50%;width:66px;height:66px;background:#fff;border-radius:50%;border:1.5px solid #E8E0D0;box-shadow:0 10px 28px rgba(0,0,0,.14);display:grid;place-items:center;cursor:pointer;animation:pulse 2.2s infinite;z-index:3}
.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:11px;background:#fff;border:1px solid #E8E0D0;padding:6px 14px;border-radius:100px;white-space:nowrap}
.blue-page{position:relative;min-height:100vh;background:linear-gradient(180deg,#0B1A3A,#162E5B 40%,#2C4E8A);color:#fff}
.gold-frame{position:absolute;inset:14px;border:1px solid rgba(212,175,55,.35);border-radius:4px;pointer-events:none}
.blue-content{padding:54px 22px 18px;text-align:center;position:relative;z-index:2}
.basmala{font-family:'Amiri';font-size:12px;color:#D4AF37;margin-bottom:18px}
.rings{width:76px;height:42px;margin:0 auto 18px;position:relative}
.ring{position:absolute;width:44px;height:44px;border:2px solid #D4AF37;border-radius:50%;top:0}
.ring1{left:0}.ring2{left:22px}
.names .l1{font-family:'Playfair Display';font-size:32px;font-weight:700;display:block;animation:fadeUp .5s .2s both}
.names .and{font-size:22px;color:#D4AF37;margin:6px 0;display:block;animation:fadeUp .5s .4s both}
.names .l2{font-family:'Playfair Display';font-size:34px;color:#D4AF37;font-weight:700;display:block;animation:fadeUp .5s .5s both}
.desc{font-size:13px;line-height:1.9;margin:16px auto;max-width:300px;opacity:.9;animation:fadeUp .5s .6s both}
.datebox{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;border:1px solid rgba(212,175,55,.45);border-radius:12px;padding:12px;margin:16px 0;font-size:11px;background:rgba(255,255,255,.05);animation:fadeUp .5s .7s both}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.count .cd{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 4px;text-align:center}
.count .cd span{font-size:20px;font-weight:800;display:block}.count .cd div{font-size:10px;opacity:.6;margin-top:2px}
.light{background:#FFFBF2;padding:0 0 18px;color:#333}
.divi{display:flex;align-items:center;justify-content:center;gap:14px;padding:16px 0}
.divi span{width:60px;height:1px;background:var(--gold);opacity:.5}
.divi i{width:10px;height:10px;border:1.5px solid var(--gold);transform:rotate(45deg);display:block}
.sec-title{font-family:'Amiri';font-size:20px;color:#6B5A3A;text-align:center;font-weight:800;margin:6px 0}
.info{background:#FFF8E8;border:1px solid #E9DCC0;border-radius:14px;padding:14px;margin:10px 14px;text-align:center}
.btn-map{width:100%;background:#0B1A3A;color:#D4AF37;border:1px solid #D4AF37;padding:11px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}
.quote{background:#0B1A3A;padding:22px 18px;text-align:center;color:#E8C875}
.quote .qt{font-family:'Amiri';font-size:15px;line-height:2}
.rsvp-sec{background:#FFFBF2;padding:14px}
.rsvp-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:14px}
.rsvp-input{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--border);margin-bottom:8px;font-family:'Cairo'}
.footer{background:linear-gradient(180deg,#0B1A3A,#060E24);padding:24px 16px;text-align:center;color:#fff}
.share{border:1px solid rgba(255,255,255,.15);padding:12px 18px;border-radius:100px;width:100%;max-width:340px;margin:10px auto;display:flex;justify-content:center;gap:8px;cursor:pointer;background:rgba(255,255,255,.06);color:#fff}

/* floral etc */
.floral-header{height:40vh;min-height:300px;display:grid;place-items:center;background:linear-gradient(135deg,#FFF0F0,#FFE8E8);text-align:center;padding:20px}
.floral-names{font-family:'Great Vibes';font-size:44px;color:#8A2A4A;line-height:1.2}
.minimal-page{background:#FFFEF8;min-height:100vh;padding:50px 20px;text-align:center}
.min-line{width:1px;height:50px;background:var(--gold);margin:18px auto}

/* admin */
.admin-modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7);backdrop-filter:blur(16px);display:none;overflow:auto;padding:16px}
.admin-modal.show{display:block}
.admin-box{max-width:1100px;margin:20px auto;background:var(--bg);border-radius:20px;border:2px solid var(--border);overflow:hidden}
.admin-head{background:var(--green);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.admin-tabs{display:flex;gap:8px;padding:12px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}
.admin-tab{padding:8px 14px;border-radius:100px;border:1px solid var(--border);background:var(--bg);font-size:12px;font-weight:700;cursor:pointer}
.admin-tab.active{background:var(--green);color:#fff}
.admin-sec{padding:16px;display:none}.admin-sec.show{display:block}
.admin-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.input,select.input,textarea.input{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--border);font-family:'Cairo';font-size:13px;background:#fff;margin-bottom:8px}
</style>
</head>
<body>
<div id="mainSite">
<div class="hero">
<h1>دعوات <span>Invito</span> الأصلية</h1>
<p>كل قالب له ستايل مختلف - مش كلهم خريطة - دوسي مشاهدة يفتح الدعوة كاملة بالأنيميشن 💙</p>
</div>
<div class="filters" id="filters"></div>
<div class="grid-wrap"><div class="grid" id="grid"></div></div>
</div>

<button class="admin-fab" onclick="openLogin()">✦ لوحة التحكم</button>
<div class="toast" id="toast"></div>

<!-- FULL INVITATION MODAL - THIS IS WHAT OPENS ON MASHADAH -->
<div class="inv-modal" id="invModal">
<button class="close-inv" onclick="closeInv()">✕</button>
<div class="invite-wrapper" id="inviteWrapper"></div>
</div>

<!-- LOGIN -->
<div class="admin-modal" id="loginModal" style="z-index:600">
<div style="max-width:360px;margin:80px auto;background:#fff;border-radius:20px;padding:24px;border:2px solid var(--border);text-align:center">
<h3 style="font-family:'Amiri'">🔐 دخول</h3>
<input id="adminPass" type="password" class="input" placeholder="••••••••" autocomplete="current-password" style="margin:16px 0">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn btn-white" onclick="closeLogin()">إلغاء</button><button class="btn btn-dark" onclick="checkLogin()">دخول</button></div>
</div>
</div>

<!-- ADMIN -->
<div class="admin-modal" id="adminModal">
<div class="admin-box">
<div class="admin-head"><div>✨ Lamsa Design - قوالب متنوعة</div><button onclick="closeAdmin()" style="background:#fff;border:0;width:32px;height:32px;border-radius:50%;cursor:pointer">✕</button></div>
<div class="admin-tabs">
<button class="admin-tab active" onclick="switchTab('templates')">🎨 القوالب</button>
<button class="admin-tab" onclick="switchTab('clients')">👰 إنشاء دعوة</button>
<button class="admin-tab" onclick="switchTab('settings')">⚙️ إعدادات</button>
</div>
<div class="admin-sec show" id="tab-templates">
<div class="admin-card"><h4>📋 10 قوالب متنوعة - زي invito الأصلي</h4><div id="templatesTable" style="display:grid;gap:8px;margin-top:10px"></div></div>
<div class="admin-card" style="border:2px dashed var(--green);background:#FFFBF2">
<h4>➕ إضافة قالب جديد</h4>
<div style="display:grid;gap:8px;margin-top:8px">
<input id="newTmplAr" class="input" placeholder="اسم القالب - مثال: زفاف ملكي">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="newTmplId" class="input" placeholder="ID"><input id="newTmplCode" class="input" placeholder="كود"><select id="newTmplCat" class="input"><option value="wedding">زفاف</option><option value="engagement">خطوبة</option><option value="katb-ketab">كتب كتاب</option></select><select id="newTmplLayout" class="input"><option value="map">🗺️ خريطة</option><option value="royal">👑 ملكي</option><option value="floral">🌸 فلورال</option><option value="emerald">💚 زمرد</option><option value="gold">✨ ذهبي</option><option value="minimal">🤍 مينيمال</option><option value="burgundy">🍷 برجندي</option><option value="boho">🌾 بوهو</option></select></div>
<input id="newTmplDesc" class="input" value="تصميم فاخر">
<button class="btn btn-dark" style="width:100%" onclick="addTemplate()">➕ إضافة</button>
</div>
</div>
</div>
<div class="admin-sec" id="tab-clients">
<div class="admin-card" style="border:2px solid var(--green);background:#FFFBF2">
<h4>👰 إنشاء دعوة</h4>
<div style="display:grid;gap:10px;margin-top:10px">
<select id="clientTemplate" class="input" style="border:2px solid var(--gold);padding:12px;font-weight:700"><option value="">— اختاري القالب —</option></select>
<div id="selectedInfo" style="font-size:11px;background:#fff;padding:8px;border-radius:8px;border:1px dashed var(--border)">اختاري قالب</div>
<input id="clientNames" class="input" placeholder="Shahd و Abdul-Rashid" value="Shahd و Abdul-Rashid">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="clientDate" type="date" class="input" value="2026-08-28"><input id="clientTime" type="time" class="input" value="20:00"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="story1" class="input" value="الفرع"><input id="story2" class="input" value="كتب الكتاب"><input id="story3" class="input" value="الخطوبة"><input id="story4" class="input" value="الفاتحة"><input id="story5" class="input" value="اتقابلنا"></div>
<input id="clientVenue" class="input" value="عزبة زايد - امام المنزل"><input id="clientMap" class="input" placeholder="رابط خرائط جوجل"><input id="clientWA" class="input" placeholder="واتساب العميلة">
</div>
<button class="btn btn-gold" style="width:100%;margin-top:12px;padding:14px" onclick="createLink()">👁️ معاينة + إنشاء رابط 💙</button>
<div id="clientLinkResult" style="margin-top:12px"></div>
</div>
</div>
<div class="admin-sec" id="tab-settings">
<div class="admin-card"><input id="setWA" class="input" placeholder="رقم واتساب"><input id="setMap" class="input" placeholder="رابط الخريطة"></div>
<button class="btn btn-dark" style="width:100%" onclick="saveSettings()">💾 حفظ</button>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let WA=localStorage.getItem('lamsa_wa')||'201060692738';
let selected=null;
function toast(m){const el=$('toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800);}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function getTemplates(){
 return [
  {id:"shahd-map",cat:"wedding",ar:"قالب شهد - خريطة الحب 💙",desc:"خريطة + قلب ينبض يفتح دعوة زرقاء - نفس الفيديو",code:"INVITO-01",layout:"map",theme:{mapBg:"#F9F6EE",blue1:"#0B1A3A",blue2:"#162E5B",blue3:"#2C4E8A",gold:"#D4AF37",pin:"#D95E8E",quoteBg:"#0B1A3A"}},
  {id:"royal-blue",cat:"wedding",ar:"قالب ملكي أزرق 👑",desc:"دعوة زرقاء ملكية - خواتم متحركة - بدون خريطة",code:"INVITO-02",layout:"royal",theme:{blue1:"#0B1A3A",blue2:"#162E5B",blue3:"#2C4E8A",gold:"#D4AF37",pin:"#D4AF37",quoteBg:"#0B1A3A"}},
  {id:"floral-pink",cat:"wedding",ar:"قالب فلورال وردي 🌸",desc:"ورود بتتفتح - أسماء بخط كبير - أنيميشن ناعم",code:"INVITO-03",layout:"floral",theme:{blue1:"#4A1A2E",blue2:"#7A2E4A",blue3:"#9A4A6A",gold:"#E8A0BF",pin:"#E94A7A",quoteBg:"#FFF0F0",bg:"#FFF9F5",textGold:"#8A2A4A"}},
  {id:"emerald",cat:"wedding",ar:"قالب زمرد أخضر 💚",desc:"أوراق شجر متحركة - دعوة خضراء فاخرة",code:"INVITO-04",layout:"emerald",theme:{blue1:"#0A2E1F",blue2:"#1A4A2E",blue3:"#2E6A4A",gold:"#A8D5A0",pin:"#2E8A5A",quoteBg:"#0A2E1F"}},
  {id:"gold-black",cat:"wedding",ar:"قالب ذهبي أسود فاخر ✨",desc:"خلفية سوداء - كتابة ذهبية تلمع",code:"INVITO-05",layout:"gold",theme:{blue1:"#1A1A0A",blue2:"#2E2A1A",blue3:"#4A3E2A",gold:"#D4AF37",pin:"#D4AF37",quoteBg:"#1A1A0A"}},
  {id:"minimal",cat:"wedding",ar:"قالب مينيمال أبيض 🤍",desc:"تصميم أبيض بسيط - خط ذهبي رفيع",code:"INVITO-06",layout:"minimal",theme:{blue1:"#2A2A2A",blue2:"#4A4A4A",blue3:"#6A6A6A",gold:"#D4AF37",pin:"#2A2A2A",quoteBg:"#FFFEF8",bg:"#FFFEF8",textGold:"#6B5A3A"}},
  {id:"burgundy",cat:"wedding",ar:"قالب برجندي 🍷",desc:"لون برجندي دافئ - قلوب متطايرة",code:"INVITO-07",layout:"burgundy",theme:{blue1:"#3A0F1A",blue2:"#5A1A2A",blue3:"#7A2A3A",gold:"#E8C4A0",pin:"#A02A4A",quoteBg:"#3A0F1A"}},
  {id:"katb",cat:"katb-ketab",ar:"قالب كتب الكتاب 📖",desc:"تصميم إسلامي - زخارف متحركة",code:"INVITO-08",layout:"royal",theme:{blue1:"#0F2A1A",blue2:"#1A4A2A",blue3:"#2A6A3A",gold:"#C5D5A0",pin:"#2A8A4A",quoteBg:"#0F2A1A"}},
  {id:"engagement",cat:"engagement",ar:"قالب خطوبة 💍",desc:"خواتم متداخلة متحركة",code:"INVITO-09",layout:"minimal",theme:{blue1:"#2A1A3A",blue2:"#4A2A5A",blue3:"#6A3A7A",gold:"#D5A0FF",pin:"#9A4AFF",quoteBg:"#FBF5FF",bg:"#FBF5FF",textGold:"#6A3A7A"}},
  {id:"boho",cat:"wedding",ar:"قالب بوهو 🌾",desc:"ستايل بوهيمي - ألوان صحراوية",code:"INVITO-10",layout:"boho",theme:{blue1:"#3A1E0A",blue2:"#5A2E1A",blue3:"#7A3E2A",gold:"#FFD5A0",pin:"#D45A1A",quoteBg:"#3A1E0A"}}
 ];
}
let base;
try{base=JSON.parse(localStorage.getItem('lamsa_templates')||'null')||getTemplates();}catch(e){base=getTemplates();}
if(base.length<8)base=getTemplates();
localStorage.setItem('lamsa_templates',JSON.stringify(base));
let activeCat='all';
let cats=[['all','الكل'],['wedding','زفاف'],['engagement','خطوبة'],['katb-ketab','كتب كتاب']];

function renderFilters(){const el=$('filters');el.innerHTML=cats.map(c=>`<button class="fbtn ${activeCat===c[0]?'active':''}" data-c="${c[0]}">${c[1]}</button>`).join('');document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{activeCat=b.dataset.c;renderFilters();renderGrid();});}
function renderGrid(){
 const grid=$('grid');
 let list=activeCat==='all'?base:base.filter(t=>t.cat===activeCat);
 grid.innerHTML=list.map((t,i)=>{
  let preview='';

function addTemplate(){

 let themes={map:{mapBg:"#F9F6EE",blue1:"#0B1A3A",blue2:"#162E5B",blue3:"#2C4E8A",gold:"#D4AF37",pin:"#D95E8E",quoteBg:"#0B1A3A"},royal:{blue1:"#0B1A3A",blue2:"#162E5B",blue3:"#2C4E8A",gold:"#D4AF37",pin:"#D4AF37",quoteBg:"#0B1A3A"},floral:{blue1:"#4A1A2E",blue2:"#7A2E4A",blue3:"#9A4A6A",gold:"#E8A0BF",pin:"#E94A7A",quoteBg:"#FFF0F0",bg:"#FFF9F5",textGold:"#8A2A4A"},emerald:{blue1:"#0A2E1F",blue2:"#1A4A2E",blue3:"#2E6A4A",gold:"#A8D5A0",pin:"#2E8A5A",quoteBg:"#0A2E1F"},gold:{blue1:"#1A1A0A",blue2:"#2E2A1A",blue3:"#4A3E2A",gold:"#D4AF37",pin:"#D4AF37",quoteBg:"#1A1A0A"},minimal:{blue1:"#2A2A2A",blue2:"#4A4A4A",blue3:"#6A6A6A",gold:"#D4AF37",pin:"#2A2A2A",quoteBg:"#FFFEF8",bg:"#FFFEF8",textGold:"#6B5A3A"},burgundy:{blue1:"#3A0F1A",blue2:"#5A1A2A",blue3:"#7A2A3A",gold:"#E8C4A0",pin:"#A02A4A",quoteBg:"#3A0F1A"},boho:{blue1:"#3A1E0A",blue2:"#5A2E1A",blue3:"#7A3E2A",gold:"#FFD5A0",pin:"#D45A1A",quoteBg:"#3A1E0A"}};
 base.push({id,cat,ar,desc:desc||'تصميم فاخر',code,layout,theme:themes[layout]||themes['royal']});

   <div class="footer"><div style="font-size:24px">💛</div><div style="font-family:'Amiri';font-size:16px;margin:8px 0;color:${esc(theme.gold)}">شكراً لكم بكل حب</div><button class="share" onclick="shareInv()">↗️ مشاركة الدعوة</button><div style="font-size:10px;opacity:.5;margin-top:12px">Lamsa Design - ${esc(t.code)}</div></div>`;
}
function openBlue(){const m=$('mapSection'),b=$('blueSection');if(m&&b){m.style.transition='opacity .4s';m.style.opacity='0';setTimeout(()=>{m.style.display='none';b.style.display='block';b.style.animation='fadeUp .5s';window.scrollTo(0,0);},400);}}
function closeInv(){$('invModal').classList.remove('show');$('inviteWrapper').innerHTML='';document.body.style.overflow='';history.replaceState(null,'',location.href.split('?')[0]);}
function shareInv(){window.open('https://wa.me/?text='+encodeURIComponent('دعوة زفاف 💍\n'+location.href),'_blank');}
function doRSVP(s){const n=$('guestName')?.value.trim();if(!n){toast('اكتبي اسمك');return;}$('rsvpRes').textContent='✅ شكراً '+n+' - '+s;toast('تم الحفظ');}
function sendWish(){const n=$('wishName')?.value.trim(),m=$('wishMsg')?.value.trim();if(!n||!m){toast('اكملي البيانات');return;}toast('💌 تم الإرسال');$('wishName').value='';$('wishMsg').value='';}

function createLink(){
 let tmpl=$('clientTemplate').value, names=$('clientNames').value.trim();
 if(!tmpl){toast('اختاري القالب');return;}
 if(!names){toast('اكتبي الأسماء');return;}
 const t=base.find(x=>x.id===tmpl);
 const params=new URLSearchParams();
 params.set('inv',tmpl); params.set('names',names); params.set('date',$('clientDate').value); params.set('time',$('clientTime').value); params.set('venue',$('clientVenue').value);
 params.set('map',$('clientMap').value); params.set('s1',$('story1').value); params.set('s2',$('story2').value); params.set('s3',$('story3').value); params.set('s4',$('story4').value); params.set('s5',$('story5').value);
 showInvitation(t,params);
 const link=location.href.split('?')[0]+'?'+params.toString();
 $('clientLinkResult').innerHTML=`<div style="background:#fff;border:2px solid var(--gold);border-radius:12px;padding:12px"><div style="font-weight:800">✅ دعوة ${esc(names)} - ${esc(t.ar)}</div><div style="background:#FFFBF2;border:1px dashed var(--border);padding:8px;border-radius:8px;margin-top:8px;font-size:11px;word-break:break-all">${esc(link)}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button class="btn btn-dark" onclick="navigator.clipboard.writeText('${link}').then(()=>toast('تم النسخ'))">📋 نسخ</button><button class="btn btn-gold" onclick="window.open('${link}','_blank')">👁️ فتح</button></div><a href="https://wa.me/${$('clientWA').value||''}?text=${encodeURIComponent('مبروك '+names+' 💍\n'+link)}" target="_blank" style="background:#25D366;color:#fff;padding:11px;border-radius:10px;display:flex;justify-content:center;margin-top:8px;text-decoration:none;font-weight:800">📱 واتساب</a></div>`;
 toast('تم الإنشاء ✨');
}

function openLogin(){$('loginModal').classList.add('show');}
function closeLogin(){$('loginModal').classList.remove('show');$('adminPass').value='';}
function checkLogin(){if($('adminPass').value.trim()==='lamsa2026'){closeLogin();openAdmin();}else{toast('كلمة السر غلط');}}
function openAdmin(){$('adminModal').classList.add('show');$('setWA').value=WA;$('setMap').value=localStorage.getItem('lamsa_map')||'';renderTable();renderSelect();}
function closeAdmin(){$('adminModal').classList.remove('show');}
function switchTab(n){document.querySelectorAll('.admin-tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.admin-sec').forEach(s=>s.classList.remove('show'));document.querySelector(`.admin-tab[onclick*="${n}"]`)?.classList.add('active');$('tab-'+n)?.classList.add('show');}
function saveSettings(){WA=$('setWA').value.trim();localStorage.setItem('lamsa_wa',WA);localStorage.setItem('lamsa_map',$('setMap').value.trim());toast('تم الحفظ');}

(function(){
 renderFilters();renderGrid();renderTable();renderSelect();
 const p=new URLSearchParams(location.search);
 if(p.get('inv')){
  setTimeout(()=>{const t=base.find(x=>x.id===p.get('inv'))||base[0];showInvitation(t,p);},400);
 }
})();
</script>
</body>
